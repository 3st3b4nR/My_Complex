name: MyComplex CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-tests:
    name: Gateway tests
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Configure Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: mycomplex-gateway/pom.xml

      - name: Allow Maven Wrapper execution
        working-directory: mycomplex-gateway
        run: chmod +x mvnw

      - name: Test gateway
        working-directory: mycomplex-gateway
        run: ./mvnw --batch-mode test

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mycomplex
          POSTGRES_USER: mycomplex_user
          POSTGRES_PASSWORD: mycomplex_test
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mycomplex_user -d mycomplex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mycomplex
      SPRING_DATASOURCE_USERNAME: mycomplex_user
      SPRING_DATASOURCE_PASSWORD: mycomplex_test

      AUTH0_ISSUER: https://auth0.test/
      AUTH0_AUDIENCE: https://api.mycomplex.test
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: https://auth0.test/.well-known/jwks.json

      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Configure Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: mycomplex-backend/pom.xml

      - name: Allow Maven Wrapper execution
        working-directory: mycomplex-backend
        run: chmod +x mvnw

      - name: Test backend
        working-directory: mycomplex-backend
        run: ./mvnw --batch-mode test

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs:
      - gateway-tests
      - backend-tests

    env:
      POSTGRES_DB: mycomplex
      POSTGRES_USER: mycomplex_user
      POSTGRES_PASSWORD: mycomplex_build
      AUTH0_ISSUER: https://auth0.test/
      AUTH0_AUDIENCE: https://api.mycomplex.test

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Validate Compose
        run: docker compose config

      - name: Build Docker images
        run: docker compose build