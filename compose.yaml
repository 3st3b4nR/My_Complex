name: mycomplex

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    container_name: mycomplex-azurite
    restart: unless-stopped
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --blobPort
      - "10000"
      - --location
      - /data
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - mycomplex_azurite_data:/data

  postgres:
    image: postgres:17-alpine
    container_name: mycomplex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mycomplex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./mycomplex-backend
      dockerfile: Dockerfile
    image: mycomplex-backend:local
    container_name: mycomplex-backend
    restart: unless-stopped
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH0_ISSUER: ${AUTH0_ISSUER}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_MANAGEMENT_DOMAIN: ${AUTH0_MANAGEMENT_DOMAIN}
      AUTH0_MANAGEMENT_CLIENT_ID: ${AUTH0_MANAGEMENT_CLIENT_ID}
      AUTH0_MANAGEMENT_CLIENT_SECRET: ${AUTH0_MANAGEMENT_CLIENT_SECRET}
      AUTH0_MANAGEMENT_AUDIENCE: ${AUTH0_MANAGEMENT_AUDIENCE}
      AUTH0_DATABASE_CONNECTION: ${AUTH0_DATABASE_CONNECTION}
      AUTH0_APPLICATION_CLIENT_ID: ${AUTH0_APPLICATION_CLIENT_ID}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER}
      RESEND_ENABLED: ${RESEND_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_MAX_RETRIES: ${RESEND_MAX_RETRIES:-5}
      RESEND_RETRY_DELAY: ${RESEND_RETRY_DELAY:-30s}
      RESEND_DISPATCH_INTERVAL: ${RESEND_DISPATCH_INTERVAL:-5s}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FCM_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-}
      FIREBASE_WEB_AUTH_DOMAIN: ${FIREBASE_WEB_AUTH_DOMAIN:-}
      FIREBASE_WEB_PROJECT_ID: ${FIREBASE_WEB_PROJECT_ID:-}
      FIREBASE_WEB_STORAGE_BUCKET: ${FIREBASE_WEB_STORAGE_BUCKET:-}
      FIREBASE_WEB_MESSAGING_SENDER_ID: ${FIREBASE_WEB_MESSAGING_SENDER_ID:-}
      FIREBASE_WEB_APP_ID: ${FIREBASE_WEB_APP_ID:-}
      FIREBASE_WEB_VAPID_KEY: ${FIREBASE_WEB_VAPID_KEY:-}
      FCM_MAX_RETRIES: ${FCM_MAX_RETRIES:-3}
      FCM_RETRY_DELAY: ${FCM_RETRY_DELAY:-1m}
      FCM_DISPATCH_INTERVAL: ${FCM_DISPATCH_INTERVAL:-5s}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:4200}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      MANAGEMENT_SERVER_PORT: "9080"
      OBSERVABILITY_LOG_FILE: /var/log/mycomplex/backend.json
      OBSERVABILITY_TRACING_SAMPLING_PROBABILITY: ${OBSERVABILITY_TRACING_SAMPLING_PROBABILITY:-0.10}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}
      SPRING_REACTOR_CONTEXT_PROPAGATION: auto
    expose:
      - "8080"
      - "9080"
    volumes:
      - mycomplex_backend_logs:/var/log/mycomplex
      - ${FIREBASE_CREDENTIALS_PATH}:/run/secrets/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://localhost:9080/actuator/health > /dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    build:
      context: ./mycomplex-gateway
      dockerfile: Dockerfile
    image: mycomplex-gateway:local
    container_name: mycomplex-gateway
    restart: unless-stopped
    environment:
      AUTH0_ISSUER: ${AUTH0_ISSUER}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      BACKEND_URL: http://backend:8080
      MANAGEMENT_SERVER_PORT: "9081"
      OBSERVABILITY_LOG_FILE: /var/log/mycomplex/gateway.json
      OBSERVABILITY_TRACING_SAMPLING_PROBABILITY: ${OBSERVABILITY_TRACING_SAMPLING_PROBABILITY:-0.10}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}
    ports:
      - "8081:8081"
    expose:
      - "9081"
    volumes:
      - mycomplex_gateway_logs:/var/log/mycomplex
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://localhost:9081/actuator/health > /dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mycomplex_postgres_data:
    name: mycomplex_postgres_data
  mycomplex_azurite_data:
    name: mycomplex_azurite_data
  mycomplex_backend_logs:
    name: mycomplex_backend_logs
  mycomplex_gateway_logs:
    name: mycomplex_gateway_logs
