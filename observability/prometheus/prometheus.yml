global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mycomplex-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:9080"]

  - job_name: mycomplex-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:9081"]
