name: mycomplex

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: mycomplex-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - mycomplex_prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  loki:
    image: grafana/loki:3.7.9
    container_name: mycomplex-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - mycomplex_loki_data:/loki
    healthcheck:
      test:
        - CMD
        - /usr/bin/loki
        - -config.file=/etc/loki/loki.yaml
        - -verify-config=true
      interval: 10s
      timeout: 5s
      retries: 10

  tempo:
    image: grafana/tempo:3.1.1
    container_name: mycomplex-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
    expose:
      - "4317"
      - "4318"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - mycomplex_tempo_data:/var/tempo
    healthcheck:
      test:
        - CMD
        - /tempo
        - -config.file=/etc/tempo/tempo.yaml
        - -config.verify=true
        - -config.verify-errors-only=true
      interval: 10s
      timeout: 5s
      retries: 10

  alloy:
    image: grafana/alloy:v1.21.2
    container_name: mycomplex-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - mycomplex_backend_logs:/var/log/mycomplex/backend:ro
      - mycomplex_gateway_logs:/var/log/mycomplex/gateway:ro
      - mycomplex_alloy_data:/var/lib/alloy
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /bin/alloy
        - validate
        - /etc/alloy/config.alloy
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:13.3.0
    container_name: mycomplex-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - mycomplex_grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mycomplex_prometheus_data:
    name: mycomplex_prometheus_data
  mycomplex_loki_data:
    name: mycomplex_loki_data
  mycomplex_tempo_data:
    name: mycomplex_tempo_data
  mycomplex_alloy_data:
    name: mycomplex_alloy_data
  mycomplex_grafana_data:
    name: mycomplex_grafana_data
