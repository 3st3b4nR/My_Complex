services:
  backend:
    environment:
      FCM_ENABLED: "true"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - type: bind
        source: ${FIREBASE_CREDENTIALS_PATH:?Set FIREBASE_CREDENTIALS_PATH to the service-account JSON}
        target: /run/secrets/firebase-service-account.json
        read_only: true
        bind:
          create_host_path: false
