spring.application.name=mycomplex-gateway
server.port=8081

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}

spring.cloud.gateway.server.webflux.routes[0].id=mycomplex-backend
spring.cloud.gateway.server.webflux.routes[0].uri=${BACKEND_URL:http://localhost:8080}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/**
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type,X-Correlation-Id
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=X-Correlation-Id
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true