spring.application.name=mycomplex-gateway
server.port=8081
spring.reactor.context-propagation=auto

management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=${OBSERVABILITY_TRACING_SAMPLING_PROBABILITY:0.10}
management.tracing.export.otlp.enabled=true
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.resource-attributes.service.name=${spring.application.name}

logging.structured.format.console=ecs
logging.structured.format.file=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.file.name=${OBSERVABILITY_LOG_FILE:logs/mycomplex-gateway.json}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}

spring.cloud.gateway.server.webflux.routes[0].id=mycomplex-backend
spring.cloud.gateway.server.webflux.routes[0].uri=${BACKEND_URL:http://localhost:8080}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/**
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type,X-Correlation-Id
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=X-Correlation-Id
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
