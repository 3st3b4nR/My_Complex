spring.application.name=mycomplex-backend

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

auth0.management.domain=${AUTH0_MANAGEMENT_DOMAIN:}
auth0.management.client-id=${AUTH0_MANAGEMENT_CLIENT_ID:}
auth0.management.client-secret=${AUTH0_MANAGEMENT_CLIENT_SECRET:}
auth0.management.audience=${AUTH0_MANAGEMENT_AUDIENCE:}
auth0.management.database-connection=${AUTH0_DATABASE_CONNECTION:}
auth0.management.application-client-id=${AUTH0_APPLICATION_CLIENT_ID:}
auth0.management.connect-timeout=${AUTH0_MANAGEMENT_CONNECT_TIMEOUT:3s}
auth0.management.response-timeout=${AUTH0_MANAGEMENT_RESPONSE_TIMEOUT:8s}
auth0.management.token-expiry-margin=${AUTH0_MANAGEMENT_TOKEN_EXPIRY_MARGIN:60s}
auth0.management.provisioning-timeout=${AUTH0_PROVISIONING_TIMEOUT:5m}
auth0.management.resend-cooldown=${AUTH0_INVITATION_RESEND_COOLDOWN:5m}
