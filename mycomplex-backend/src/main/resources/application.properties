spring.application.name=mycomplex-backend

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

management.server.port=${MANAGEMENT_SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=${OBSERVABILITY_TRACING_SAMPLING_PROBABILITY:0.10}
management.tracing.export.otlp.enabled=true
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.resource-attributes.service.name=${spring.application.name}

logging.structured.format.console=ecs
logging.structured.format.file=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.file.name=${OBSERVABILITY_LOG_FILE:logs/mycomplex-backend.json}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

auth0.management.domain=${AUTH0_MANAGEMENT_DOMAIN:}
auth0.management.client-id=${AUTH0_MANAGEMENT_CLIENT_ID:}
auth0.management.client-secret=${AUTH0_MANAGEMENT_CLIENT_SECRET:}
auth0.management.audience=${AUTH0_MANAGEMENT_AUDIENCE:}
auth0.management.database-connection=${AUTH0_DATABASE_CONNECTION:}
auth0.management.application-client-id=${AUTH0_APPLICATION_CLIENT_ID:}
auth0.management.connect-timeout=${AUTH0_MANAGEMENT_CONNECT_TIMEOUT:3s}
auth0.management.response-timeout=${AUTH0_MANAGEMENT_RESPONSE_TIMEOUT:8s}
auth0.management.token-expiry-margin=${AUTH0_MANAGEMENT_TOKEN_EXPIRY_MARGIN:60s}
auth0.management.provisioning-timeout=${AUTH0_PROVISIONING_TIMEOUT:5m}
auth0.management.resend-cooldown=${AUTH0_INVITATION_RESEND_COOLDOWN:5m}
