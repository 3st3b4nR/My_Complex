spring.application.name=mycomplex-backend

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

mycomplex.storage.blob.connection-string=${AZURE_STORAGE_CONNECTION_STRING:UseDevelopmentStorage=true}
mycomplex.storage.blob.container=${AZURE_STORAGE_CONTAINER:mycomplex-news}

mycomplex.notifications.email.resend.enabled=${RESEND_ENABLED:false}
mycomplex.notifications.email.resend.api-key=${RESEND_API_KEY:}
mycomplex.notifications.email.resend.from=${RESEND_FROM_EMAIL:}
mycomplex.notifications.email.resend.base-url=${RESEND_BASE_URL:https://api.resend.com}

mycomplex.notifications.push.firebase.enabled=${FIREBASE_ENABLED:false}
mycomplex.notifications.push.firebase.project-id=${FIREBASE_PROJECT_ID:}
mycomplex.notifications.push.firebase.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:4200}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
