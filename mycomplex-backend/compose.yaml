services:
	ports:
	  - "127.0.0.1:10000:10000"
	volumes:
	  - mycomplex_azurite_data:/data
  postgres:
    image: postgres:17-alpine
    container_name: mycomplex-postgres
    environment:
      POSTGRES_DB: mycomplex
      POSTGRES_USER: mycomplex_user
      POSTGRES_PASSWORD: mycomplex_local
    ports:
      - "5433:5432"
    volumes:
      - mycomplex_postgres_data:/var/lib/postgresql/data

volumes:
  mycomplex_postgres_data: